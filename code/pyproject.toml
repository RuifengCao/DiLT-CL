[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diltcl"
dynamic = ["version"]
description = "DiLT-CL: disentangled lottery-ticket continual learning (research code)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=1.10",
    "torchvision>=0.11",
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.optional-dependencies]
router = ["scikit-learn>=1.0"]
gw = ["POT>=0.8"]
figures = ["matplotlib>=3.5"]
dev = ["pytest>=7", "pyflakes>=3", "matplotlib>=3.5"]

[tool.setuptools]
packages = ["diltcl"]

[tool.setuptools.dynamic]
# Single source of truth: diltcl/__init__.py::__version__ (also written into
# every result artifact as code_version).
version = { attr = "diltcl.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
